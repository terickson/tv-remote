services:
  tv-remote:
    build:
      context: .
      args:
        VITE_FR_TV_HOST: ${VITE_FR_TV_HOST:-http://192.168.72.20:8080}
        VITE_FR_ROKU_HOST: ${VITE_FR_ROKU_HOST:-http://192.168.72.222:8080}
        VITE_FR_RECEIVER_HOST: ${VITE_FR_RECEIVER_HOST:-http://192.168.72.222:8081}
        VITE_MBR_TV_HOST: ${VITE_MBR_TV_HOST:-http://192.168.72.25:8080}
        VITE_MBR_ROKU_HOST: ${VITE_MBR_ROKU_HOST:-http://192.168.72.222:8080}
    ports:
      - "3001:3001"
    restart: unless-stopped
